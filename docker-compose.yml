# Local lab services. The app stays on DuckDB until STORAGE_BACKEND=postgres.
# Passwords come from .env. Postgres does not use trust authentication.

services:
  timescale:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cnc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cnc}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  nats:
    image: nats:2.10
    # nats:2.10 has no lame-duck CLI flag. Docker's stop grace is 5 s, and the
    # acceptance harness sends SIGKILL after 2 s, so a drain cannot hold the fault.
    command: ["-js", "--auth", "${NATS_TOKEN:?set NATS_TOKEN in .env}"]
    stop_grace_period: 5s
    ports:
      - "${NATS_PORT:-4222}:4222"

  redis:
    image: redis:7
    container_name: cnc-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    ports:
      - "6379:6379"
