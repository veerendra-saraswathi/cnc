[pytest]
markers =
    postgres: repository tests that need a reachable Postgres (skipped when it is not)
    nats: JetStream tests that need NATS, Postgres, and Redis (skipped when a service is not reachable)
    sitl: ArduCopter SITL tests (skipped unless CNC_SITL=1)
    ros2: Gazebo ROS 2 tests (skipped unless CNC_ROS2=1)
